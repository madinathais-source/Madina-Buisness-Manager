<!doctype html>
<html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#14532d"><title>অনলাইন অর্ডার | মদিনা থাইস</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>
*{box-sizing:border-box}body{margin:0;background:#f3f6f4;color:#17251c;font:16px system-ui,"Noto Sans Bengali",sans-serif}.wrap{max-width:620px;margin:28px auto;padding:16px}.card{background:white;border:1px solid #dce5de;border-radius:16px;padding:22px;box-shadow:0 8px 28px #143d2410}h1{font-size:23px;margin:0 0 5px;color:#14532d}.muted{color:#64746a;font-size:14px}.field{margin:14px 0}label{display:block;font-weight:600;margin-bottom:6px}input,textarea{width:100%;padding:12px;border:1px solid #cbd8ce;border-radius:9px;font:inherit}button{width:100%;padding:13px;border:0;border-radius:9px;background:#14532d;color:white;font:inherit;font-weight:700}#msg{margin-top:14px;padding:10px;border-radius:8px}.ok{background:#e8f5eb;color:#14532d}.err{background:#fff0ef;color:#b42318}
</style></head><body><main class="wrap"><div class="card"><h1>মদিনা থাই অ্যালুমিনিয়াম এন্ড এস এস গ্যালারি</h1><p class="muted">অনলাইনে অর্ডার করতে নিচের তথ্য পূরণ করুন। অর্ডার যাচাই করে দোকান থেকে যোগাযোগ করা হবে।</p><form id="orderForm"><div class="field"><label>আপনার নাম *</label><input id="name" required maxlength="120"></div><div class="field"><label>মোবাইল নম্বর *</label><input id="phone" required inputmode="tel" maxlength="30"></div><div class="field"><label>ডেলিভারি ঠিকানা</label><textarea id="address" rows="2" maxlength="500"></textarea></div><div class="field"><label>কোন পণ্য / কী কাজ করতে চান? *</label><textarea id="items" rows="3" required maxlength="2000" placeholder="পণ্যের নাম, পরিমাণ, মাপ বা কাজের বিবরণ"></textarea></div><div class="field"><label>অতিরিক্ত কথা (ঐচ্ছিক)</label><textarea id="notes" rows="2" maxlength="1000"></textarea></div><button id="submitBtn">অর্ডার পাঠান</button></form><div id="msg" hidden></div><p class="muted">এটি অর্ডারের অনুরোধ; দোকান থেকে নিশ্চিত না করা পর্যন্ত অর্ডার চূড়ান্ত নয়।</p></div></main>
<script>
(()=>{const client=window.supabase.createClient("https://vgojtclskrjxlqfrecxk.supabase.co","sb_publishable_3PbzagUEN9y7OJdnbCL2Hg_l_NKoBcY");const token="34146727-4d91-4d72-b067-b83d5b86629e";const form=document.getElementById('orderForm'),btn=document.getElementById('submitBtn'),msg=document.getElementById('msg');form.addEventListener('submit',async e=>{e.preventDefault();btn.disabled=true;btn.textContent='পাঠানো হচ্ছে…';msg.hidden=true;const {error}=await client.from('public_order_requests').insert({store_token:token,customer_name:document.getElementById('name').value.trim(),phone:document.getElementById('phone').value.trim(),address:document.getElementById('address').value.trim(),items:document.getElementById('items').value.trim(),notes:document.getElementById('notes').value.trim()});btn.disabled=false;btn.textContent='অর্ডার পাঠান';msg.hidden=false;if(error){msg.className='err';msg.textContent='অর্ডার পাঠানো যায়নি। অনুগ্রহ করে পরে আবার চেষ্টা করুন।';return}msg.className='ok';msg.textContent='আপনার অর্ডারের অনুরোধ গ্রহণ করা হয়েছে। ধন্যবাদ!';form.reset()})})();
</script></body></html>
